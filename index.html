<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Royaume des Savoirs">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0a2e">
<meta property="og:title" content="Le Royaume des Savoirs">
<meta property="og:description" content="Plateforme magique pour enfants — 9 royaumes, 46 niveaux, du CP au CM2.">
<meta property="og:type" content="website">
<meta name="description" content="Le Royaume des Savoirs — Maths, Culture, Sciences, Code, Art, Logique, Geo du CP au CM2">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏰</text></svg>">
<link rel="manifest" href="manifest.json">
<title>Le Royaume des Savoirs</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   ENCHANTED KINGDOM — Dark Magical Theme
   ══════════════════════════════════════════ */
:root {
  --bg-deep: #0f0a2e;
  --bg-mid: #1a1145;
  --bg-surface: #231854;
  --bg-card: rgba(255,255,255,0.06);
  --bg-card-solid: #1e1650;
  --border-glow: rgba(251,191,36,0.25);
  --border-subtle: rgba(255,255,255,0.08);
  --text-bright: #faf5ff;
  --text-mid: #c4b5fd;
  --text-dim: #8b7ec8;
  --gold: #fbbf24;
  --gold-light: #fde68a;
  --gold-dark: #b8860b;
  --green: #34d399;
  --red: #f87171;
  --blue: #60a5fa;
  --purple: #a78bfa;
  --radius-sm: 12px;
  --radius-md: 18px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --shadow-card: 0 8px 32px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.2);
  --shadow-card-hover: 0 16px 48px rgba(0,0,0,0.4), 0 4px 16px rgba(251,191,36,0.1);
  --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
::selection{background:rgba(251,191,36,0.3);color:#faf5ff}

body{
  background: var(--bg-deep);
  background-image:
    radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.08) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(168,85,247,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 80%, rgba(251,191,36,0.04) 0%, transparent 50%);
  background-attachment: fixed;
  color: var(--text-bright);
  font-family:'Quicksand',-apple-system,BlinkMacSystemFont,sans-serif;
  overflow-x:hidden;min-height:100vh;min-height:100dvh;
  font-weight:500;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(251,191,36,0.3);border-radius:3px}

/* ══ ANIMATIONS ══ */
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes sparkle{0%,100%{opacity:.5;transform:scale(.85)}50%{opacity:1;transform:scale(1.2)}}
@keyframes confetti{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(1080deg);opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(251,191,36,.15)}50%{box-shadow:0 0 40px rgba(251,191,36,.35)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes twinkle{0%,100%{opacity:0.15;transform:scale(0.5)}50%{opacity:1;transform:scale(1)}}
@keyframes drift{0%{transform:translateY(0) translateX(0)}25%{transform:translateY(-20px) translateX(10px)}50%{transform:translateY(-5px) translateX(-5px)}75%{transform:translateY(-15px) translateX(8px)}100%{transform:translateY(0) translateX(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{opacity:0;transform:scale(0.3)}60%{transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
@keyframes correctBurst{0%{box-shadow:0 0 0 0 rgba(52,211,153,0.5)}70%{box-shadow:0 0 0 18px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@keyframes wrongShake{0%,100%{transform:translateX(0)}10%{transform:translateX(-6px)}30%{transform:translateX(6px)}50%{transform:translateX(-4px)}70%{transform:translateX(2px)}}
@keyframes orbFloat{0%{transform:translate(0,0) scale(1)}33%{transform:translate(15px,-25px) scale(1.05)}66%{transform:translate(-10px,-10px) scale(0.95)}100%{transform:translate(0,0) scale(1)}}

.fade-in{animation:slideUp .55s var(--transition-bounce) both}
.bounce{animation:bounce 2s ease-in-out infinite}
.float{animation:float 4s ease-in-out infinite}
.pulse{animation:pulse 1.5s ease-in-out infinite}
.sparkle-anim{animation:sparkle 2.5s ease-in-out infinite}
.glow-anim{animation:glow 3s ease-in-out infinite}

/* ══ STARFIELD ══ */
#stars-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.star{position:absolute;border-radius:50%;background:white;animation:twinkle var(--dur) ease-in-out infinite;animation-delay:var(--delay)}
.star.gold{background:#fbbf24}
.star.purple{background:#a78bfa}
/* Floating orbs for depth */
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:1;filter:blur(60px);opacity:0.4;animation:orbFloat 12s ease-in-out infinite}
.orb-1{width:300px;height:300px;background:rgba(99,102,241,0.15);top:10%;left:-5%;animation-delay:0s}
.orb-2{width:250px;height:250px;background:rgba(251,191,36,0.08);bottom:20%;right:-5%;animation-delay:-4s}
.orb-3{width:200px;height:200px;background:rgba(236,72,153,0.08);top:50%;left:50%;animation-delay:-8s}

/* ══ LAYOUT ══ */
.container{max-width:760px;margin:0 auto;padding:0 16px 100px;position:relative;z-index:10}
.text-center{text-align:center}
.flex-1{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:12px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.gap-2{gap:8px}
.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}.mt-8{margin-top:32px}
.mb-2{margin-bottom:8px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.py-4{padding-top:16px;padding-bottom:16px}
.py-6{padding-top:24px;padding-bottom:24px}
.py-8{padding-top:32px;padding-bottom:32px}
.hidden{display:none!important}

/* ══ HEADER ══ */
header{
  position:sticky;top:0;z-index:100;
  padding:16px 20px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(15,10,46,0.8);
  backdrop-filter:blur(24px) saturate(1.8);
  -webkit-backdrop-filter:blur(24px) saturate(1.8);
  border-bottom:1px solid rgba(251,191,36,0.1);
  box-shadow:0 4px 30px rgba(0,0,0,0.4);
}
header h1{
  font-family:'Fredoka',sans-serif;font-size:clamp(1.05rem,3vw,1.45rem);font-weight:700;
  color:var(--gold);letter-spacing:0.01em;
  text-shadow:0 0 24px rgba(251,191,36,0.25);
}
.header-sub{
  font-size:.65rem;color:var(--text-dim);font-family:'Fredoka',sans-serif;
  letter-spacing:.15em;text-transform:uppercase;font-weight:600;
  background:linear-gradient(90deg,var(--gold),#f472b6,var(--purple),var(--gold));
  background-size:300% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  animation:shimmer 4s linear infinite;
}
.header-left{display:flex;align-items:center;gap:10px;cursor:pointer}
#backArrow{color:var(--gold);font-size:1.3rem;font-weight:bold;transition:transform .2s}
.header-left:hover #backArrow:not(.hidden){transform:translateX(-3px)}

/* ══ CARDS ══ */
.card{
  /* Fond solide sombre : garanti sur toutes les WebViews (iOS inclus).
     Le backdrop-filter est gardé en no-op cosmétique sur navigateurs
     qui le supportent, mais ne change rien visuellement ici. */
  background:var(--bg-card-solid);
  border:1px solid var(--border-subtle);
  box-shadow:var(--shadow-card);
  border-radius:var(--radius-lg);padding:20px;margin-bottom:16px;
  transition:all .35s var(--transition-smooth);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);
}
.card.clickable{cursor:pointer}
.card.clickable:hover,.card.clickable:active{
  transform:translateY(-4px) scale(1.01);
  box-shadow:var(--shadow-card-hover);
  border-color:rgba(251,191,36,0.15);
}

/* ══ KINGDOM GATES ══ */
.kingdom-gate{
  position:relative;overflow:hidden;cursor:pointer;
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:2px solid rgba(255,255,255,0.06);
  border-radius:var(--radius-xl);
  padding:0;margin-bottom:18px;
  transition:all .45s var(--transition-bounce);
  z-index:10;
}
.kingdom-glow{
  position:absolute;inset:0;opacity:0.6;pointer-events:none;
  transition:opacity .4s;
}
.kingdom-border-glow{
  position:absolute;inset:0;border-radius:var(--radius-xl);pointer-events:none;
  border:2px solid var(--k-color,rgba(255,255,255,0.1));
  opacity:0.3;transition:opacity .4s;
}
.kingdom-gate:hover .kingdom-border-glow,
.kingdom-gate:active .kingdom-border-glow{opacity:0.7}
.kingdom-gate:hover .kingdom-glow,
.kingdom-gate:active .kingdom-glow{opacity:1}
.kingdom-gate:hover,.kingdom-gate:active{
  transform:translateY(-6px) scale(1.02);
  border-color:var(--k-color,rgba(251,191,36,0.2));
  box-shadow:0 16px 48px rgba(0,0,0,0.5), 0 0 40px color-mix(in srgb,var(--k-color) 20%,transparent);
}
.kingdom-inner{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:18px;
  padding:24px 26px;
}
.kingdom-mascot{
  font-size:4rem;flex-shrink:0;
  filter:drop-shadow(0 6px 16px rgba(0,0,0,0.4));
  transition:transform .5s var(--transition-bounce);
  line-height:1;
}
.kingdom-gate:hover .kingdom-mascot{
  transform:scale(1.2) rotate(-8deg);
}
.kingdom-info{flex:1;min-width:0}
.kingdom-name{
  font-family:'Fredoka',sans-serif;font-size:1.25rem;font-weight:700;
  margin:0;letter-spacing:0.01em;
  text-shadow:0 0 20px currentColor;
}
.kingdom-stage{
  font-size:.82rem;color:var(--text-mid);font-weight:600;margin-top:4px;
  font-family:'Quicksand',sans-serif;
}
.kingdom-xp-track{
  width:100%;height:6px;border-radius:3px;
  background:rgba(255,255,255,0.06);overflow:hidden;margin-top:10px;
}
.kingdom-xp-fill{
  height:100%;border-radius:3px;
  transition:width .6s var(--transition-smooth);
  position:relative;
}
.kingdom-xp-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.35),transparent);
  animation:shimmer 2.5s linear infinite;background-size:200% 100%;
}
.kingdom-stats{
  display:flex;gap:14px;margin-top:8px;
  font-size:.72rem;color:var(--text-dim);font-weight:600;
  font-family:'Quicksand',sans-serif;
}
.kingdom-enter{
  font-size:1.8rem;flex-shrink:0;
  opacity:0.5;transition:all .4s var(--transition-bounce);
  filter:drop-shadow(0 0 8px currentColor);
}
.kingdom-gate:hover .kingdom-enter{
  opacity:1;transform:translateX(5px);
}
@media(max-width:400px){
  .kingdom-inner{padding:18px 16px;gap:14px}
  .kingdom-mascot{font-size:3rem}
  .kingdom-name{font-size:1.05rem}
}

/* ══ SUBJECT CARDS ══ */
.subject-card{
  background:var(--bg-card);
  backdrop-filter:blur(16px);
  border:2px solid var(--border-subtle);
  border-radius:var(--radius-xl);padding:22px 24px;margin-bottom:14px;
  cursor:pointer;transition:all .4s var(--transition-bounce);
  display:flex;align-items:center;gap:18px;
  position:relative;overflow:hidden;
}
.subject-card::after{
  content:'';position:absolute;inset:0;opacity:0;
  background:radial-gradient(circle at 30% 50%, rgba(251,191,36,0.06), transparent 70%);
  transition:opacity .3s;pointer-events:none;
}
.subject-card:hover::after,.subject-card:active::after{opacity:1}
.subject-card:hover,.subject-card:active{
  transform:translateY(-4px) scale(1.015);
  border-color:rgba(251,191,36,0.25);
  box-shadow:0 12px 40px rgba(0,0,0,0.4), 0 0 30px rgba(251,191,36,0.06);
}
.subject-emoji{font-size:3.2rem;flex-shrink:0;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3));transition:transform .4s var(--transition-bounce)}
.subject-card:hover .subject-emoji{transform:scale(1.15) rotate(-5deg)}
.subject-info{flex:1;min-width:0}
.subject-name{font-family:'Fredoka',sans-serif;font-size:1.2rem;font-weight:700;margin:0;color:var(--text-bright)}
.subject-desc{font-size:.85rem;color:var(--text-dim);margin-top:4px;font-weight:500}

/* ══ BUTTONS ══ */
.btn-fire{
  background:linear-gradient(135deg,#fbbf24 0%,#f7a020 50%,#e8850a 100%);
  color:#1a0a00;font-weight:700;border:none;cursor:pointer;
  border-radius:var(--radius-md);padding:16px 24px;
  font-size:1.05rem;font-family:'Fredoka',sans-serif;letter-spacing:.02em;
  transition:all .3s var(--transition-bounce);width:100%;display:block;
  box-shadow:0 4px 20px rgba(251,191,36,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
  position:relative;overflow:hidden;
}
.btn-fire::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent 60%);pointer-events:none;
}
.btn-fire:hover,.btn-fire:active{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 8px 28px rgba(251,191,36,0.45), inset 0 1px 0 rgba(255,255,255,0.25);
}
.btn-fire:disabled{opacity:.35;cursor:default;transform:none;box-shadow:none}

.btn-stone{
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);
  color:var(--text-bright);cursor:pointer;
  border-radius:var(--radius-sm);padding:13px 18px;
  font-size:.9rem;font-family:'Fredoka',sans-serif;font-weight:600;
  transition:all .3s var(--transition-smooth);width:100%;display:block;
}
.btn-stone:hover,.btn-stone:active{
  background:rgba(251,191,36,0.08);border-color:rgba(251,191,36,0.2);
  transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,0.2);
}
.btn-small{padding:9px 16px;font-size:.8rem;width:auto;display:inline-block;margin-right:6px;margin-bottom:6px}
.btn-row{display:flex;gap:12px;flex-wrap:wrap}
.btn-row>*{flex:1;min-width:140px}

/* ══ CHOICES ══ */
.choices-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.choices-grid{grid-template-columns:1fr}}

.choice-btn{
  background:rgba(255,255,255,0.04);
  border:2px solid rgba(255,255,255,0.08);
  color:var(--text-bright);cursor:pointer;
  border-radius:var(--radius-md);padding:16px 18px;
  text-align:left;font-size:1.02rem;
  font-family:'Quicksand',sans-serif;font-weight:600;
  transition:all .3s var(--transition-bounce);width:100%;display:block;
  position:relative;
}
.choice-btn:hover:not(:disabled):not(.correct):not(.wrong){
  border-color:var(--gold);background:rgba(251,191,36,0.06);
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 8px 24px rgba(0,0,0,0.3), 0 0 16px rgba(251,191,36,0.08);
}
.choice-btn:disabled{cursor:default}
.choice-btn.correct{
  border-color:var(--green)!important;
  background:rgba(52,211,153,0.12)!important;
  color:#a7f3d0!important;
  animation:correctBurst .6s ease-out;
  box-shadow:0 0 20px rgba(52,211,153,0.15)!important;
}
.choice-btn.wrong{
  border-color:var(--red)!important;
  background:rgba(248,113,113,0.1)!important;
  color:#fca5a5!important;
  animation:wrongShake .5s ease-in-out;
}
.choice-letter{color:var(--gold);font-weight:700;margin-right:10px;font-family:'Fredoka',sans-serif}

/* ══ STATS ══ */
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;text-align:center}
.stat-card{
  background:rgba(255,255,255,0.04);border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);padding:14px 8px;
}
.stat-val{font-size:1.6rem;font-weight:800;font-family:'Fredoka',sans-serif;text-shadow:0 0 10px currentColor}
.stat-label{font-size:.68rem;color:var(--text-dim);margin-top:4px;font-weight:600}

/* ══ PROGRESS ══ */
.progress-track{width:100%;height:8px;border-radius:4px;background:rgba(255,255,255,0.06);overflow:hidden}
.progress-fill{
  height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--gold),#f472b6,var(--purple));
  transition:width .5s;position:relative;
}
.progress-fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);
  animation:shimmer 2s linear infinite;background-size:200% 100%;
}
.timer-track{width:100%;height:10px;border-radius:5px;background:rgba(255,255,255,0.06);overflow:hidden;margin-top:4px}
.timer-fill{height:100%;border-radius:5px;transition:width 1s linear}

.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(251,191,36,0.15),transparent);margin:20px 0}

.badge{
  font-size:.72rem;padding:4px 12px;border-radius:9999px;
  background:rgba(251,191,36,0.08);color:var(--gold);
  border:1px solid rgba(251,191,36,0.15);
  font-family:'Fredoka',sans-serif;font-weight:600;display:inline-block;
}
.badge-cat{background:rgba(139,92,246,0.1);color:var(--purple);border-color:rgba(139,92,246,0.2)}
.stars{font-size:.75rem;color:var(--gold);margin-left:8px;text-shadow:0 0 6px rgba(251,191,36,0.3)}

/* ══ DRAGON / KINGDOM ══ */
.dragon-card{
  background:linear-gradient(135deg,rgba(251,191,36,0.1),rgba(251,191,36,0.03));
  border:2px solid rgba(251,191,36,0.2);
  border-radius:var(--radius-xl);padding:28px;text-align:center;
  position:relative;overflow:hidden;margin-bottom:16px;
  box-shadow:0 8px 32px rgba(251,191,36,0.08);
}
.dragon-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 30%, rgba(251,191,36,0.06), transparent 70%);pointer-events:none;
}
.dragon-emoji{font-size:5.5rem;display:inline-block;filter:drop-shadow(0 8px 24px rgba(251,191,36,0.25));animation:float 4s ease-in-out infinite}
.dragon-name{font-family:'Fredoka',sans-serif;font-size:1.4rem;color:var(--gold);font-weight:700;margin-top:8px;text-shadow:0 0 16px rgba(251,191,36,0.2)}
.dragon-stage{font-family:'Fredoka',sans-serif;font-size:.8rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.1em;margin-top:4px;font-weight:600}

.xp-bar-track{width:100%;height:14px;background:rgba(255,255,255,0.05);border-radius:7px;overflow:hidden;margin-top:14px;border:1px solid rgba(255,255,255,0.06)}
.xp-bar-fill{
  height:100%;
  background:linear-gradient(90deg,var(--gold),#f472b6,var(--purple),var(--blue));
  background-size:300% 100%;animation:shimmer 3s linear infinite;
  transition:width .8s var(--transition-bounce);border-radius:7px;
  box-shadow:0 0 10px rgba(251,191,36,0.25);
}
.xp-label{font-family:'Fredoka',sans-serif;font-size:.75rem;color:var(--text-dim);margin-top:6px;font-weight:600}

.resources-row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.resource{
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);
  border-radius:9999px;padding:7px 16px;display:flex;align-items:center;gap:6px;
  font-family:'Fredoka',sans-serif;font-size:.85rem;color:var(--text-bright);font-weight:600;
}
.resource.xp{border-color:rgba(167,139,250,0.25);color:var(--purple);text-shadow:0 0 6px rgba(167,139,250,0.25)}
.resource.flame{border-color:rgba(251,191,36,0.25);color:var(--gold);text-shadow:0 0 6px rgba(251,191,36,0.25)}
.resource.crystal{border-color:rgba(96,165,250,0.25);color:var(--blue);text-shadow:0 0 6px rgba(96,165,250,0.25)}

/* ══ QUEST ══ */
.quest-card{
  background:linear-gradient(135deg,rgba(139,92,246,0.08),rgba(99,102,241,0.05));
  border:1px solid rgba(139,92,246,0.15);
  border-radius:var(--radius-lg);padding:16px;margin-bottom:16px;position:relative;overflow:hidden;
}
.quest-card::before{
  content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;
  background:radial-gradient(circle, rgba(251,191,36,0.08), transparent);pointer-events:none;
}
.quest-title{font-family:'Fredoka',sans-serif;color:var(--purple);font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:6px;font-weight:700}
.quest-desc{color:var(--text-bright);margin-bottom:10px;font-weight:600;font-size:.93rem}
.quest-progress{font-family:'Fredoka',sans-serif;font-size:.85rem;color:var(--purple);font-weight:600}
.quest-done{color:var(--green)!important;text-shadow:0 0 6px rgba(52,211,153,0.25)}

/* ══ DRAGONNET ══ */
.dragonnet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:12px;margin-top:12px}
.dragonnet-card{
  background:rgba(255,255,255,0.03);border:2px solid rgba(255,255,255,0.06);
  border-radius:var(--radius-md);padding:14px;text-align:center;
  transition:all .4s var(--transition-bounce);cursor:pointer;
}
.dragonnet-card.unlocked{
  border-color:rgba(251,191,36,0.25);
  background:linear-gradient(135deg,rgba(251,191,36,0.06),rgba(251,191,36,0.01));
  box-shadow:0 4px 16px rgba(251,191,36,0.08);
}
.dragonnet-card.unlocked:hover{transform:scale(1.08);box-shadow:0 8px 24px rgba(251,191,36,0.15)}
.dragonnet-card.locked{opacity:.3;filter:grayscale(.8) brightness(.6)}
.dragonnet-emoji{font-size:2.6rem;display:block;margin-bottom:6px}
.dragonnet-name{font-family:'Fredoka',sans-serif;font-size:.86rem;color:var(--gold);font-weight:700}
.dragonnet-elem{font-size:.68rem;color:var(--text-dim);margin-top:2px;font-weight:500}
.dragonnet-unlock{font-size:.7rem;color:var(--blue);margin-top:4px;font-weight:600}

/* ══ BADGE GRID ══ */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin-top:12px}
.badge-card{
  background:rgba(255,255,255,0.02);border:2px solid rgba(255,255,255,0.04);
  border-radius:var(--radius-md);padding:12px;text-align:center;
  opacity:.25;transition:all .4s var(--transition-bounce);
}
.badge-card.unlocked{
  opacity:1;background:linear-gradient(135deg,rgba(251,191,36,0.08),rgba(251,191,36,0.02));
  border-color:rgba(251,191,36,0.2);box-shadow:0 4px 16px rgba(251,191,36,0.06);
}
.badge-card.unlocked:hover{transform:scale(1.05)}
.badge-ic{font-size:2rem}
.badge-name{font-size:.73rem;color:var(--gold);margin-top:4px;font-family:'Fredoka';font-weight:700}
.badge-desc{font-size:.63rem;color:var(--text-dim);margin-top:2px;font-weight:500}

/* ══ BAR CHART ══ */
.bar-chart{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.bar-row{display:flex;align-items:center;gap:10px;font-size:.85rem}
.bar-label{width:130px;color:var(--text-mid);font-size:.83rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:14px;background:rgba(255,255,255,0.05);border-radius:7px;overflow:hidden}
.bar-fill{height:100%;border-radius:7px;transition:width .8s var(--transition-bounce)}
.bar-val{color:var(--text-bright);font-weight:700;font-family:'Fredoka';width:44px;text-align:right;font-size:.85rem}

/* ══ WEAK/STRONG ══ */
.weak-cat{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.15);border-radius:var(--radius-sm);margin-bottom:8px}
.strong-cat{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(52,211,153,0.06);border:1px solid rgba(52,211,153,0.15);border-radius:var(--radius-sm);margin-bottom:8px}

.parent-btn{
  background:rgba(139,92,246,0.08);color:var(--purple);border:1px solid rgba(139,92,246,0.15);
  padding:12px 18px;border-radius:var(--radius-sm);cursor:pointer;
  font-family:'Fredoka';font-size:.88rem;font-weight:600;transition:all .3s;
}
.parent-btn:hover,.parent-btn:active{background:rgba(139,92,246,0.15);transform:translateY(-1px)}

.session-item{
  background:rgba(255,255,255,0.03);border:1px solid var(--border-subtle);
  border-radius:var(--radius-sm);padding:12px;margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:center;font-size:.85rem;
}

/* ══ NAME PROMPT ══ */
.name-prompt{
  background:rgba(255,255,255,0.05);border:2px solid rgba(251,191,36,0.15);
  border-radius:var(--radius-md);padding:16px;
  color:var(--text-bright);font-size:1.1rem;width:100%;font-family:inherit;
  margin-bottom:12px;font-weight:600;transition:all .3s;
}
.name-prompt:focus{outline:none;border-color:var(--gold);background:rgba(251,191,36,0.04);box-shadow:0 0 20px rgba(251,191,36,0.08)}
.name-prompt::placeholder{color:var(--text-dim)}

/* ══ PEDAGOGY ══ */
.pedago-box{
  background:linear-gradient(135deg,rgba(251,191,36,0.06),rgba(251,191,36,0.02));
  border:1px solid rgba(251,191,36,0.12);border-radius:var(--radius-md);padding:14px;margin-top:12px;
}
.pedago-title{color:var(--gold);font-weight:700;font-family:'Fredoka',sans-serif;font-size:.83rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.pedago-step{color:var(--text-bright);margin-bottom:6px;padding-left:12px;border-left:3px solid var(--gold);padding-top:4px;padding-bottom:4px;font-weight:500}

.tip-box{background:rgba(52,211,153,0.05);border:1px solid rgba(52,211,153,0.12);border-radius:var(--radius-md);padding:14px;margin-top:10px}
.tip-label{color:var(--green);font-weight:700}
.tip-text{color:#a7f3d0}

.error-box{background:rgba(248,113,113,0.05);border:1px solid rgba(248,113,113,0.12);border-radius:var(--radius-md);padding:14px;margin-top:10px}
.error-label{color:var(--red);font-weight:700}

.recap-item{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.recap-icon{font-size:1.2rem;margin-top:2px}
.recap-q{color:var(--text-bright);font-size:.86rem;line-height:1.5;font-weight:500}
.recap-answer{color:var(--green);font-size:.76rem;margin-top:4px;font-weight:600}
.recap-scroll{max-height:300px;overflow-y:auto;padding-right:8px}

a.detail-link{color:var(--purple);font-size:.88rem;text-decoration:none;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;font-weight:700;transition:color .2s}
a.detail-link:hover{color:var(--gold)}

/* ══ TYPO ══ */
.fancy-title,.fredoka{font-family:'Fredoka',sans-serif}
h2.title{font-family:'Fredoka',sans-serif;font-weight:700;margin-bottom:12px;color:var(--text-bright)}
h3.card-title{font-family:'Fredoka',sans-serif;font-weight:600;margin:0 0 4px;color:var(--text-bright)}
p.sub{font-size:.9rem;color:var(--text-dim);margin:0;font-weight:500}
p.desc{font-size:.78rem;color:var(--text-dim);margin:4px 0 0;font-weight:500}
.arrow{color:var(--gold);font-size:1.4rem;font-weight:bold;transition:transform .3s}
.card.clickable:hover .arrow,.subject-card:hover .arrow{transform:translateX(4px)}

.xp-gain{font-family:'Fredoka',sans-serif;font-weight:700;font-size:.85rem;color:var(--purple);text-shadow:0 0 8px rgba(167,139,250,0.3);animation:popIn .4s var(--transition-bounce)}
.crystal-gain{font-family:'Fredoka',sans-serif;font-weight:700;font-size:.85rem;color:var(--blue);text-shadow:0 0 8px rgba(96,165,250,0.3);animation:popIn .4s var(--transition-bounce) .1s both}
.huge-icon{font-size:5rem;display:block;margin-bottom:12px;filter:drop-shadow(0 8px 24px rgba(0,0,0,0.3));animation:popIn .6s var(--transition-bounce)}

/* ══ FICHE ══ */
.fiche-card{
  background:linear-gradient(135deg,rgba(255,255,255,0.05),rgba(251,191,36,0.02));
  border:2px solid rgba(251,191,36,0.12);border-radius:var(--radius-xl);
  padding:24px;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,0.3);
}
.fiche-h1{font-family:'Fredoka',sans-serif;color:var(--gold);font-size:1.5rem;font-weight:700;margin-bottom:8px;text-shadow:0 0 10px rgba(251,191,36,0.15)}
.fiche-intro{color:var(--text-mid);font-size:1.02rem;font-style:italic;margin-bottom:16px;font-weight:500}
.fiche-section{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.05)}
.fiche-section h3{font-family:'Fredoka',sans-serif;color:var(--gold);font-size:1.02rem;margin-bottom:8px;font-weight:700}
.fiche-list{list-style:none;padding:0}
.fiche-list li{padding:6px 0;padding-left:24px;position:relative;color:var(--text-bright)}
.fiche-list li:before{content:'\2728';position:absolute;left:0}
.fiche-mini{background:rgba(255,255,255,0.03);padding:8px 12px;border-radius:10px;margin-bottom:6px;border-left:3px solid var(--gold);color:var(--text-bright)}
.fiche-mini b{color:var(--gold)}
.fiche-anecdote{background:rgba(96,165,250,0.06);padding:12px 16px;border-radius:var(--radius-sm);border-left:3px solid var(--blue);font-style:italic;color:var(--blue);margin-top:14px}
.fiche-retiens{
  background:rgba(251,191,36,0.06);padding:14px 18px;border-radius:var(--radius-md);
  text-align:center;font-weight:600;color:var(--gold);margin-top:14px;
  border:1px solid rgba(251,191,36,0.15);font-size:1.02rem;text-shadow:0 0 6px rgba(251,191,36,0.15);
}

/* ══ CONFETTI / EMBERS ══ */
.confetti-piece{position:fixed;top:-20px;width:10px;height:10px;animation:confetti 2.5s linear forwards;pointer-events:none;z-index:1000;border-radius:2px}
#embers{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.ember{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 6px var(--gold),0 0 12px rgba(251,191,36,0.3);animation:drift 3s ease-in-out forwards;opacity:0.6}

#toast-area{position:fixed;top:80px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px}

footer{
  position:relative;z-index:10;text-align:center;padding:32px 20px;
  font-size:.7rem;color:var(--text-dim);font-family:'Fredoka',sans-serif;
  border-top:1px solid rgba(255,255,255,0.03);letter-spacing:.05em;
}
.user-switch{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid rgba(255,255,255,0.06)}
.user-switch-label{font-size:.9rem;color:var(--text-mid);font-weight:600;letter-spacing:.02em}
.user-switch-label b{color:var(--gold)}
.user-switch-btn{background:rgba(251,191,36,0.1);border:1px solid var(--border-glow);color:var(--gold);cursor:pointer;border-radius:9999px;padding:9px 18px;font-size:.85rem;font-family:'Fredoka',sans-serif;font-weight:600;transition:all .2s;min-height:42px;letter-spacing:.02em}
.user-switch-btn:hover,.user-switch-btn:active{background:rgba(251,191,36,0.2);box-shadow:0 0 18px rgba(251,191,36,0.18)}

/* ══ RESPONSIVE ══ */
@media(max-width:480px){
  .container{padding:0 12px 80px}
  .subject-card{padding:16px 14px;gap:12px}
  .subject-emoji{font-size:2.5rem}
  .subject-name{font-size:1.05rem}
  .dragon-emoji{font-size:4rem}
  .card{padding:16px;border-radius:var(--radius-md)}
  .stats-grid{gap:6px}
  .stat-val{font-size:1.3rem}
  header{padding:12px 14px}
  .dragonnet-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}
@media(min-width:768px){
  .container{padding:0 24px 100px}
  .subject-card{padding:26px 28px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .star,.ember,.orb{display:none}
}
@supports(padding:max(0px)){
  header{padding-top:max(16px,env(safe-area-inset-top));padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
  .container{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  footer{padding-bottom:max(32px,env(safe-area-inset-bottom))}
}
</style>
</head>
<body>

<!-- Starfield -->
<div id="stars-bg"></div>
<!-- Floating orbs for ambient depth -->
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<header>
<div class="header-left" id="headerHome">
<span id="backArrow" class="hidden">&#8592;</span>
<h1>&#x1F3F0; Le Royaume des Savoirs</h1>
</div>
<div class="header-sub">Apprends en t'amusant</div>
</header>

<div class="container" id="app"></div>

<div id="toast-area"></div>

<footer>

</div>

<!-- Starfield generator -->
<script>
(function(){
  var bg=document.getElementById('stars-bg');
  if(!bg)return;
  var n=window.innerWidth<600?50:90;
  for(var i=0;i<n;i++){
    var s=document.createElement('div');
    s.className='star'+(Math.random()>.75?' gold':Math.random()>.85?' purple':'');
    var sz=Math.random()*3+0.5;
    s.style.cssText='width:'+sz+'px;height:'+sz+'px;top:'+Math.random()*100+'%;left:'+Math.random()*100+'%;--dur:'+(2+Math.random()*5)+'s;--delay:'+Math.random()*5+'s';
    bg.appendChild(s);
  }
})();
</script>

<script src="exercises.js?v=13"></script>
<script src="exercises_extra.js?v=3"></script>
<script src="game.js?v=23"></script>
<script>
// Service Worker : enregistré uniquement en HTTPS / localhost (sinon le navigateur refuse).
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      // Si une nouvelle version est dispo, on prévient discrètement.
      reg.addEventListener('updatefound', function () {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            console.log('[sw] Nouvelle version dispo, recharge pour activer');
          }
        });
      });
    }).catch(function (e) { console.warn('[sw] échec inscription', e); });
  });
}
// Indicateur en ligne / hors-ligne.
(function () {
  function showOnlineState() {
    const id = 'offline-pill';
    let el = document.getElementById(id);
    if (navigator.onLine) {
      if (el) el.remove();
      return;
    }
    if (!el) {
      el = document.createElement('div');
      el.id = id;
      el.style.cssText = 'position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(251,191,36,.95);color:#1a0a00;padding:8px 16px;border-radius:9999px;font-family:Quicksand,sans-serif;font-weight:700;font-size:.85rem;box-shadow:0 4px 16px rgba(0,0,0,.4);z-index:9998;display:flex;align-items:center;gap:6px';
      el.innerHTML = '📴 Mode hors-ligne — défis disponibles';
      document.body.appendChild(el);
    }
  }
  window.addEventListener('online', showOnlineState);
  window.addEventListener('offline', showOnlineState);
  document.addEventListener('DOMContentLoaded', showOnlineState);
})();
</script>
