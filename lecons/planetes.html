<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🪐 Le Système Solaire</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060b1f;color:#eaf0ff;font-family:'Trebuchet MS',sans-serif;min-height:100vh;overflow-x:hidden}
.back-btn{position:fixed;top:16px;left:16px;z-index:100;background:rgba(255,200,60,.12);border:2px solid #ffc83c;color:#ffe499;border-radius:30px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.back-btn:hover{background:rgba(255,200,60,.25)}
.header{text-align:center;padding:28px 20px 10px}
.header h1{font-family:Georgia,serif;font-size:clamp(26px,5vw,36px);color:#ffe499;margin:0}
.header p{color:#7a8abf;font-size:15px;margin-top:6px}
.solar{position:relative;width:100%;max-width:800px;height:500px;margin:20px auto;overflow:hidden}
.sun{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,#fff6a0,#ffc83c 40%,#ff8c00 80%);box-shadow:0 0 60px rgba(255,200,60,.6),0 0 120px rgba(255,140,0,.3);cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;font-size:36px}
.orbit{position:absolute;left:50%;top:50%;border:1px solid rgba(255,255,255,.07);border-radius:50%;transform:translate(-50%,-50%)}
.planet-dot{position:absolute;border-radius:50%;cursor:pointer;z-index:20;transition:transform .2s;display:flex;align-items:center;justify-content:center;font-size:18px}
.planet-dot:hover{transform:scale(1.5)!important}
/* Saturne : ses anneaux sont ce qui la rend reconnaissable entre toutes. */
.rings{position:absolute;left:-42%;top:38%;width:184%;height:24%;border:2px solid;border-radius:50%;
  transform:rotate(-18deg);pointer-events:none;opacity:.85}
/* Jupiter : ses bandes de nuages, en surimpression légère. */
.banded{background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.16) 0 2px,transparent 2px 5px),var(--bg,none)}
.pastille{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:7px;vertical-align:-2px;
  box-shadow:0 0 6px rgba(0,0,0,.4) inset}
.pastille.grosse{width:22px;height:22px;margin-right:10px;vertical-align:-3px}
.info-panel{background:rgba(12,18,50,.95);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);border-radius:18px;max-width:700px;margin:0 auto 30px;padding:24px 28px}
.info-panel h2{font-family:Georgia,serif;font-size:24px;margin:0 0 8px}
.info-panel .stats{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0}
.info-panel .stat{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 14px;font-size:13px;border:1px solid rgba(255,255,255,.06)}
.info-panel .stat b{display:block;font-size:18px;font-family:Georgia,serif}
.info-panel p{line-height:1.7;font-size:15px;margin-top:10px}
.planet-nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 20px 20px}
.planet-btn{background:transparent;border:2px solid rgba(255,255,255,.15);color:#eaf0ff;border-radius:24px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.planet-btn.active{border-color:var(--pc);background:var(--pc);color:#060b1f}
</style>
<style>/* iOS : le bouton Retour etait sous la barre d'etat/encoche -> intappable */
.back-btn{top:calc(12px + env(safe-area-inset-top,0px))!important;left:calc(12px + env(safe-area-inset-left,0px))!important;z-index:9999!important;min-height:40px;display:inline-flex;align-items:center}
</style></head>
<body>
<a class="back-btn" href="../index.html">← Retour</a>
<div class="header"><h1>🪐 Le Système Solaire</h1><p>Explore les 8 planètes qui tournent autour du Soleil</p></div>
<div class="solar" id="solar"></div>
<div class="planet-nav" id="pnav"></div>
<div class="info-panel" id="info"></div>
<script>
const P=[
{name:"Mercure",color:"#8c8579",r:70,size:14,speed:4.15,dist:"58M km",diam:"4 879 km",temp:"430°C jour / -180°C nuit",dur:"88 jours",desc:"La plus petite et la plus rapide ! Mercure fait le tour du Soleil en seulement 88 jours. Elle n'a pas d'atmosphère, donc la nuit il fait -180°C et le jour 430°C. Elle est couverte de cratères, comme la Lune."},
{name:"Vénus",color:"#e3c07b",r:100,size:18,speed:1.62,dist:"108M km",diam:"12 104 km",temp:"465°C (toujours !)",dur:"225 jours",desc:"Vénus est la planète la plus chaude à cause de ses nuages épais qui gardent la chaleur (effet de serre). On l'appelle l'étoile du berger car elle brille très fort le matin ou le soir. Elle tourne à l'envers !"},
{name:"Terre",color:"#3d8fd8",r:135,size:19,speed:1,dist:"150M km",diam:"12 742 km",temp:"15°C en moyenne",dur:"365 jours",desc:"Notre maison ! La seule planète connue avec de l'eau liquide, une atmosphère respirable et la vie. La Terre a un bouclier magnétique qui nous protège du vent solaire. Sa Lune contrôle les marées."},
{name:"Mars",color:"#c1552f",r:170,size:16,speed:.53,dist:"228M km",diam:"6 779 km",temp:"-65°C en moyenne",dur:"687 jours",desc:"La planète rouge ! Sa couleur vient de la rouille (oxyde de fer) dans son sol. Mars a le plus grand volcan du système solaire : Olympus Mons (3× l'Everest). Des robots comme Perseverance l'explorent en ce moment."},
{name:"Jupiter",color:"#cf9b62",r:215,size:30,speed:.084,dist:"778M km",diam:"139 820 km",temp:"-110°C",dur:"12 ans",desc:"La géante ! Jupiter est tellement grosse qu'on pourrait mettre 1 300 Terres dedans. Sa Grande Tache Rouge est une tempête plus grande que la Terre qui dure depuis 350 ans. Elle a 95 lunes dont Europa, qui cache un océan sous la glace."},
{name:"Saturne",color:"#e0c283",r:260,size:26,speed:.034,dist:"1,4Mrd km",diam:"116 460 km",temp:"-140°C",dur:"29 ans",desc:"La merveille aux anneaux ! Ses anneaux sont faits de milliards de morceaux de glace et de roche, certains gros comme des maisons. Saturne est si légère qu'elle flotterait sur l'eau (si on trouvait une baignoire assez grande). Elle a 146 lunes !"},
{name:"Uranus",color:"#93cfd6",r:300,size:22,speed:.012,dist:"2,9Mrd km",diam:"50 724 km",temp:"-195°C",dur:"84 ans",desc:"La planète couchée ! Uranus roule sur le côté à cause d'un choc ancien. C'est une géante de glace d'un bleu-vert pâle. Ses 27 lunes portent des noms de personnages de Shakespeare. Il y fait très, très froid."},
{name:"Neptune",color:"#3f5fc4",r:340,size:21,speed:.006,dist:"4,5Mrd km",diam:"49 528 km",temp:"-200°C",dur:"165 ans",desc:"La plus lointaine et la plus venteuse ! Neptune a des vents à 2 100 km/h, les plus rapides du système solaire. Son bleu profond vient du méthane dans son atmosphère. Sa lune Triton a des geysers de glace."}
];
let sel=2,tick=0,angles=P.map(()=>Math.random()*Math.PI*2);
/* Une sphère éclairée : la lumière vient du haut-gauche, comme le Soleil
   sur la vue. Sans ce dégradé, une planète n'est qu'une pastille plate. */
function eclaircir(hex, k){
  const n = parseInt(hex.slice(1), 16);
  const m = c => Math.round(c + (255 - c) * k);
  return `rgb(${m(n>>16&255)},${m(n>>8&255)},${m(n&255)})`;
}
function assombrir(hex, k){
  const n = parseInt(hex.slice(1), 16);
  const m = c => Math.round(c * (1 - k));
  return `rgb(${m(n>>16&255)},${m(n>>8&255)},${m(n&255)})`;
}
function sphere(hex){
  return `radial-gradient(circle at 32% 28%, ${eclaircir(hex,.45)} 0%, ${hex} 52%, ${assombrir(hex,.45)} 100%)`;
}

function renderSolar(){
  const cw=document.getElementById('solar').offsetWidth,ch=500,cx=cw/2,cy=ch/2;
  // Le Soleil suivait une taille fixe pendant que les orbites se réduisaient :
  // sur un téléphone, Mercure finissait DANS le Soleil. Il suit désormais la
  // même échelle, et la première orbite est garantie hors du disque.
  let scale=Math.min(1, cw/800, (ch/2-26)/310);
  const sunD=Math.max(46, Math.round(80*scale));
  const base=sunD/2+16;
  // La plus lointaine orbite doit tenir dans le cadre, sinon Neptune sort de
  // l'écran. On la contraint sur le rayon RÉEL le plus grand, pas sur une
  // valeur devinée : ajouter une planète plus loin ne cassera rien.
  const rMax=Math.max(...P.map(x=>x.r));
  const dispo=Math.min(cx, cy)-30;
  const dehors=base+(rMax-70)*scale;
  if(dehors>dispo && dehors>base) scale*=(dispo-base)/(dehors-base);
  let h=`<div class="sun" style="width:${sunD}px;height:${sunD}px;font-size:${Math.round(sunD*0.45)}px" onclick="sel=-1;renderInfo()">☀️</div>`;
  P.forEach((p,i)=>{
    const r=base+(p.r-70)*scale;
    h+=`<div class="orbit" style="width:${r*2}px;height:${r*2}px"></div>`;
    const a=angles[i];
    const px=cx+Math.cos(a)*r-p.size/2;
    const py=cy+Math.sin(a)*r-p.size/2;
    // Un emoji dessiné par-dessus le disque le masquait : Mercure devenait un
    // caillou, Saturne une bague. On dessine la planète elle-même — sphère
    // éclairée du côté du Soleil, anneaux pour Saturne, bandes pour Jupiter.
    const anneaux = p.name === 'Saturne'
      ? `<span class="rings" style="border-color:${eclaircir(p.color, .25)}"></span>` : '';
    h+=`<div class="planet-dot${p.name==='Jupiter'?' banded':''}" style="left:${px}px;top:${py}px;width:${p.size}px;height:${p.size}px;background:${sphere(p.color)};box-shadow:0 0 ${p.size}px ${p.color}55${sel===i?';transform:scale(1.45);box-shadow:0 0 22px '+p.color:''}" onclick="sel=${i};renderInfo()">${anneaux}</div>`;
  });
  document.getElementById('solar').innerHTML=h;
}
function renderNav(){
  let h='';
  P.forEach((p,i)=>{h+=`<button class="planet-btn ${sel===i?'active':''}" style="--pc:${p.color}" onclick="sel=${i};renderInfo();renderSolar()"><span class="pastille" style="background:${sphere(p.color)}"></span>${p.name}</button>`});
  document.getElementById('pnav').innerHTML=h;
}
function renderInfo(){
  renderNav();renderSolar();
  if(sel<0){document.getElementById('info').innerHTML=`<h2 style="color:#ffc83c">☀️ Le Soleil</h2><div class="stats"><div class="stat"><b>1,4M km</b>diamètre</div><div class="stat"><b>5 500°C</b>surface</div><div class="stat"><b>15M °C</b>centre</div></div><p>Le Soleil est une étoile, une énorme boule de gaz brûlant. Il est tellement gros qu'on pourrait mettre 1,3 million de Terres dedans ! Il produit son énergie par fusion nucléaire : il transforme l'hydrogène en hélium, comme une bombe H géante qui brûle depuis 4,6 milliards d'années.</p>`;return}
  const p=P[sel];
  document.getElementById('info').innerHTML=`<h2 style="color:${p.color}"><span class="pastille grosse" style="background:${sphere(p.color)}"></span>${p.name}</h2><div class="stats"><div class="stat"><b>${p.dist}</b>distance au Soleil</div><div class="stat"><b>${p.diam}</b>diamètre</div><div class="stat"><b>${p.temp}</b>température</div><div class="stat"><b>${p.dur}</b>1 année</div></div><p>${p.desc}</p>`;
}
function animate(){
  tick++;
  P.forEach((p,i)=>{angles[i]+=p.speed*.003});
  renderSolar();
  requestAnimationFrame(animate);
}
renderInfo();animate();
</script>
</body>
</html>
