<style>
/* Pas de zoom au double-appui : un enfant qui tapote vite une tuile faisait
   grossir la page sans savoir la ramener. Le pincement reste possible. */
html,body{touch-action:manipulation}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0e27;color:#eaf0ff;font-family:'Trebuchet MS','Verdana',sans-serif;min-height:100vh;overflow-x:hidden;line-height:1.6}
.back-btn{position:fixed;top:16px;left:16px;z-index:100;background:rgba(251,146,60,.15);border:2px solid #fb923c;color:#fdba74;border-radius:30px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
.back-btn:hover{background:rgba(251,146,60,.3)}
.header{text-align:center;padding:32px 20px 8px;max-width:900px;margin:0 auto}
.header h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(26px,5vw,38px);color:#fdba74;letter-spacing:1px;margin:0}
.header p{color:#8a96c4;font-size:16px;margin-top:8px}
.container{max-width:900px;margin:0 auto;padding:0 16px 60px}
.filter-row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.filter-btn{background:transparent;border:2px solid #1c2752;color:#8a96c4;border-radius:30px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s}
.filter-btn.active{border-color:#fb923c;color:#fdba74;background:rgba(251,146,60,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:20px}
.tile{background:#121a3a;border:1px solid #1c2752;border-radius:14px;padding:16px 14px;cursor:pointer;transition:all .2s;text-align:center;position:relative}
.tile:hover{border-color:#fb923c;transform:translateY(-2px);box-shadow:0 8px 20px rgba(251,146,60,.15)}
.tile-emoji{font-size:36px;display:block;margin-bottom:6px}
.tile-title{font-size:14px;font-weight:700;color:#eaf0ff;line-height:1.3}
.tile-era{display:inline-block;margin-top:6px;font-size:11px;color:#fdba74;background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.3);border-radius:20px;padding:1px 10px}
.tile-soir{position:absolute;top:8px;right:8px;font-size:11px;background:rgba(167,139,250,.15);border:1px solid rgba(167,139,250,.4);color:#c4b5fd;border-radius:20px;padding:1px 8px;font-weight:700}
.detail{display:none}
.detail.active{display:block}
.detail-header{text-align:center;padding:24px 20px 8px}
.detail-emoji{font-size:60px;display:block;margin-bottom:6px}
.detail-title{font-family:Georgia,serif;font-size:26px;color:#fdba74;margin:0 0 4px}
.detail-sub{color:#8a96c4;font-size:15px;margin-bottom:8px}
.detail-era{display:inline-block;font-size:13px;color:#fdba74;background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.35);border-radius:20px;padding:2px 14px;margin-bottom:6px}
.detail-soir{display:inline-block;font-size:13px;color:#c4b5fd;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4);border-radius:20px;padding:2px 14px;margin-left:8px;font-weight:700}
.card{background:#121a3a;border:1px solid #1c2752;border-radius:14px;padding:18px 22px;margin-bottom:16px}
.card h3{font-family:Georgia,serif;font-size:19px;margin:0 0 10px}
.card p{margin-bottom:8px}
.card p:last-child{margin-bottom:0}
.card b{color:#fbbf24}
.card.probleme{border-left:4px solid #f87171}
.card.probleme h3{color:#fca5a5}
.card.idee{border-left:4px solid #fbbf24}
.card.idee h3{color:#fde68a}
.card.impact{border-left:4px solid #34d399}
.card.impact h3{color:#6ee7b7}
.card.etapes{border-left:4px solid #fb923c}
.card.etapes h3{color:#fdba74}
.step{background:#0a0e27;border:1px solid #1c2752;border-radius:12px;padding:14px;margin-bottom:12px}
.step-num{display:inline-block;background:#fb923c;color:#0a0e27;font-weight:900;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-size:14px;margin-right:8px}
.step-title{font-weight:700;color:#fdba74;font-size:16px;vertical-align:middle}
.step-visu{font-size:clamp(26px,6vw,36px);text-align:center;padding:14px 6px;margin:10px 0;background:linear-gradient(145deg,#0d1230,#121a3a);border:1px dashed rgba(251,146,60,.35);border-radius:12px;letter-spacing:2px;line-height:1.5;word-spacing:4px}
.step-visu .fl{display:inline-block;animation:flow 2.2s ease-in-out infinite}
@keyframes flow{0%,100%{transform:translateX(0);opacity:.65}50%{transform:translateX(5px);opacity:1}}
.step-desc{color:#dbe4ff;font-size:14.5px}
.savais{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);border-radius:12px;padding:14px 18px;margin-bottom:16px;color:#fde68a;font-size:14px}
.savais b{color:#fbbf24}
.quiz{background:#121a3a;border:1px solid #1c2752;border-left:4px solid #34d399;border-radius:14px;padding:18px 22px}
.quiz h3{font-family:Georgia,serif;font-size:18px;color:#6ee7b7;margin-bottom:14px}
.q-question{font-weight:700;color:#eaf0ff;margin-bottom:10px}
.q-choices{display:flex;flex-direction:column;gap:6px}
.q-choice{background:#0a0e27;border:1px solid #1c2752;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14px;color:#eaf0ff;text-align:left;font-family:inherit}
.q-choice:hover{border-color:#fb923c}
.q-choice.correct{background:rgba(52,211,153,.15);border-color:#34d399;color:#a7f3d0}
.q-choice.wrong{background:rgba(239,68,68,.15);border-color:#ef4444;color:#fca5a5}
.q-choice:disabled{cursor:default}
.q-expl{display:none;margin-top:8px;padding:9px 12px;background:rgba(96,165,250,.08);border-left:2px solid #60a5fa;border-radius:6px;font-size:13px;color:#c4b5fd}
.q-expl.show{display:block}
.nav-row{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{background:transparent;border:2px solid #fb923c;color:#eaf0ff;border-radius:30px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;flex:1;min-width:140px}
.btn:hover{background:rgba(251,146,60,.15)}
.btn.primary{background:#fb923c;color:#0a0e27}
</style>
