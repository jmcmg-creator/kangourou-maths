# Codemagic — build iOS + envoi TestFlight
# Pré-requis (une seule fois, voir iphone-app/SETUP.md) :
#   1. App créée dans App Store Connect avec le bundle id com.royaumesavoirs.ios
#   2. Clé API App Store Connect ajoutée dans Codemagic sous le nom "RoyaumeKey"
#
# DEUX WORKFLOWS AU CHOIX dans "Start new build" :
#   - ios-testflight        : signature AUTOMATIQUE (recommandé, zéro secret à gérer)
#   - ios-testflight-manual : signature via CLI — EXIGE la variable secrète
#     CERTIFICATE_PRIVATE_KEY (clé RSA 2048) dans le groupe d'env "signing"
#
# LIVRER UNE VERSION AUX TESTEURS :
#   git tag v1.3 && git push origin v1.3
# ios-testflight démarre alors tout seul et envoie sur TestFlight. Un merge
# sur main ne déclenche aucun build : les minutes ne partent que pour les
# versions qu'on décide vraiment de livrer.
# (ios-testflight-manual reste manuel, pour ne pas builder deux fois.)
workflows:
  ios-testflight:
    name: Royaume des Savoirs to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Départ automatique sur un tag de version (v1, v1.2, v2.0.1…).
    # Un simple merge sur main ne déclenche RIEN : on choisit ce qui part
    # chez les testeurs, et on ne consomme pas de minutes de build pour des
    # corrections intermédiaires. Pour livrer :
    #   git tag v1.3 && git push origin v1.3
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    integrations:
      app_store_connect: RoyaumeKey
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.royaumesavoirs.ios
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build web
        script: cd iphone-app && npm ci && npm run build
      - name: Capacitor sync iOS
        script: cd iphone-app && npx cap sync ios
      - name: Pod install
        script: cd iphone-app/ios/App && pod install
      - name: Apply signing
        script: xcode-project use-profiles
      - name: Bump build number
        # TestFlight refuse deux builds au même numéro : compteur Codemagic,
        # toujours croissant → on peut enchaîner les builds sans conflit.
        script: cd iphone-app/ios/App && agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: cd iphone-app/ios/App && xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App"
    artifacts:
      - iphone-app/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  ios-testflight-manual:
    name: Royaume des Savoirs to TestFlight (signature manuelle CLI)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: RoyaumeKey
    environment:
      groups:
        - signing   # doit contenir CERTIFICATE_PRIVATE_KEY (clé RSA 2048, secret)
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Build web
        script: cd iphone-app && npm ci && npm run build
      - name: Capacitor sync iOS
        script: cd iphone-app && npx cap sync ios
      - name: Pod install
        script: cd iphone-app/ios/App && pod install
      - name: Set up code signing (create cert + profile)
        # ⚠️ Nécessite CERTIFICATE_PRIVATE_KEY dans le groupe "signing".
        # La générer UNE fois (Mac/Linux/Git Bash) :  openssl genrsa 2048
        # puis coller tout le bloc -----BEGIN/END RSA PRIVATE KEY----- dans
        # Codemagic → Environment variables → groupe "signing" → Secret.
        # La MÊME clé doit rester d'un build à l'autre (sinon un nouveau
        # certificat est créé à chaque build — Apple en limite à 2 !).
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.royaumesavoirs.ios" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Bump build number
        script: cd iphone-app/ios/App && agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: cd iphone-app/ios/App && xcode-project build-ipa --workspace "App.xcworkspace" --scheme "App"
    artifacts:
      - iphone-app/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
