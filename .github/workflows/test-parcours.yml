name: Tests des parcours et de l'historique parent
on:
  pull_request:
  push:
    branches:
      - fix/parcours-eleves-questions-navigation
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: royaume_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tests JavaScript
        run: npm test
      - name: Migration et isolation PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: royaume_test
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create role anon; create role authenticated;'
          psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
          psql -v ON_ERROR_STOP=1 -f supabase/answer-history.sql
          psql -v ON_ERROR_STOP=1 -f supabase/answer-history.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-answer-history.sql
