name: Audit sécurité

# Combine 4 scanners open-source qui couvrent les principales menaces :
#   1. gitleaks  : secrets / clés API commitées par erreur
#   2. semgrep   : patterns OWASP (XSS, injection, eval, etc.)
#   3. osv-scanner : vulnérabilités CVE dans les dépendances
#   4. codeql    : analyse statique sémantique (natif GitHub)
# Plus un garde-fou local (echappement) qui ne dépend d'aucun service
# distant : les quatre scanners ci-dessus ont tous besoin du réseau, et
# l'un d'eux est déjà resté éteint une semaine sans qu'on le voie.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # tous les lundis 6h UTC

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  secrets:
    name: 🔑 gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: 🧠 semgrep (OWASP)
    runs-on: ubuntu-latest
    container:
      # Version ÉPINGLÉE. Sans épinglage l'image suit « latest » : le jour où
      # la ligne de commande change en amont, le scan tombe en erreur d'usage
      # et ne lit plus une ligne de code — sans que rien ne le signale, un
      # échec permanent ressemblant à n'importe quel autre échec. C'est ce qui
      # s'est produit : « semgrep ci » a cessé d'accepter --error et
      # --severity, et le scanner XSS est resté éteint.
      image: semgrep/semgrep:1.174.0
    steps:
      - uses: actions/checkout@v4

      # DEUX PASSES, PARCE QUE LES DEUX ENJEUX N'ONT PAS LE MÊME POIDS.
      #
      # 1. Le code livré aux enfants : bloquant. Une faille ici part dans
      #    l'app. Rien ne doit passer.
      # 2. L'outillage du dépôt (workflows, scripts de build) : informatif.
      #    Les alertes y sont réelles mais ne touchent pas l'app, et la seule
      #    qui compte — épingler les actions à une empreinte de commit —
      #    demande un travail à part (voir plus bas).
      #
      # Sans cette séparation, une alerte d'hygiène du dépôt rendrait le
      # contrôle rouge en permanence. Or un contrôle toujours rouge ne se lit
      # plus : c'est précisément ce qui a laissé ce scanner éteint une
      # semaine sans que personne ne le remarque.
      #
      # « scan » et non « ci » : seul « scan » accepte --error et --severity.
      # « ci » est prévu pour Semgrep AppSec Platform (avec un jeton) et tire
      # sa configuration du service, pas de la ligne de commande.
      - name: Code livré aux enfants (bloquant)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/xss \
            --config p/security-audit \
            --error \
            --severity ERROR \
            --severity WARNING \
            --metrics off \
            game.js index.html sw.js supa.js qr.js config.js \
            exercises.js exercises_extra.js exercises_logic.js lecons

      # À FAIRE : épingler chaque « uses: … @v4 » à une empreinte de commit
      # de 40 caractères. Un tag peut être repointé silencieusement par son
      # auteur — c'est ainsi que trivy-action et kics-github-action ont été
      # compromis. Tant que ce n'est pas fait, cette passe reste informative
      # plutôt que d'immobiliser toutes les livraisons.
      # L'outillage est prêt : docs/EPINGLER-ACTIONS.md, puis
      #   node scripts/epingler-actions.mjs
      - name: Outillage du dépôt (informatif)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/xss \
            --config p/security-audit \
            --error \
            --severity ERROR \
            --severity WARNING \
            --exclude node_modules \
            --exclude iphone-app/ios \
            --metrics off \
            .github scripts iphone-app supabase

  echappement:
    name: 🛡️ Échappement HTML (local, sans réseau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/test-echappement.mjs
      # Même famille : un contrôle purement local, sans réseau, sur une panne
      # qui ne se voit pas tant qu'on a du réseau (cache hors connexion cassé).
      - run: node scripts/test-versions.mjs

  osv:
    name: 🐛 osv-scanner (CVE dépendances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

  codeql:
    name: 🔬 CodeQL (analyse statique)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
