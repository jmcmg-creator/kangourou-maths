name: Audit sécurité

# Combine 4 scanners open-source qui couvrent les principales menaces :
#   1. gitleaks  : secrets / clés API commitées par erreur
#   2. semgrep   : patterns OWASP (XSS, injection, eval, etc.)
#   3. osv-scanner : vulnérabilités CVE dans les dépendances
#   4. codeql    : analyse statique sémantique (natif GitHub)
# Plus un garde-fou local (echappement) qui ne dépend d'aucun service
# distant : les quatre scanners ci-dessus ont tous besoin du réseau, et
# l'un d'eux est déjà resté éteint une semaine sans qu'on le voie.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # tous les lundis 6h UTC

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  secrets:
    name: 🔑 gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: 🧠 semgrep (OWASP)
    runs-on: ubuntu-latest
    container:
      # Version ÉPINGLÉE. Sans épinglage l'image suit « latest » : le jour où
      # la ligne de commande change en amont, le scan tombe en erreur d'usage
      # et ne lit plus une ligne de code — sans que rien ne le signale, un
      # échec permanent ressemblant à n'importe quel autre échec. C'est ce qui
      # s'est produit : « semgrep ci » a cessé d'accepter --error et
      # --severity, et le scanner XSS est resté éteint.
      image: semgrep/semgrep:1.174.0
    steps:
      - uses: actions/checkout@v4
      # « scan » et non « ci » : seul « scan » accepte --error et --severity.
      # « ci » est prévu pour Semgrep AppSec Platform (avec un jeton) et tire
      # sa configuration du service, pas de la ligne de commande.
      - run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/xss \
            --config p/security-audit \
            --error \
            --severity ERROR \
            --severity WARNING \
            --exclude node_modules \
            --exclude iphone-app/ios \
            --metrics off

  echappement:
    name: 🛡️ Échappement HTML (local, sans réseau)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/test-echappement.mjs

  osv:
    name: 🐛 osv-scanner (CVE dépendances)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --recursive
            --skip-git
            ./

  codeql:
    name: 🔬 CodeQL (analyse statique)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
