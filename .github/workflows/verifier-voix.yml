name: Vérifier la voix générée

# Fait écouter par Whisper chaque poème et vingt lignes de tables générés, et
# compare au texte attendu. Voir scripts/verifier-voix.py.

on:
  workflow_dispatch:
  push:
    # Jamais sur main : la fusion d'une branche voix y rejouerait toute la
    # génération et redéposerait des clips par-dessus la version livrée.
    branches-ignore: [main]
    paths:
      - 'scripts/verifier-voix.py'
      - '.github/workflows/verifier-voix.yml'
      # Un lot poussé à la main (le dépôt par le bot de CI, lui, ne déclenche
      # rien : c'est GitHub qui veut ça) est réécouté.
      - 'audio/voix/**'

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet faster-whisper jiwer numpy
      - name: Vérifier
        run: python scripts/verifier-voix.py
      - name: Déposer le rapport
        if: always()
        run: |
          git config user.name 'github-actions[bot]'; git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add echantillons/verification.json 2>/dev/null || true
          git diff --cached --quiet || { git commit -m "Rapport de vérification de la voix (Whisper)"; git pull --rebase --autostash origin ${{ github.ref_name }}; git push origin HEAD:${{ github.ref_name }}; }
